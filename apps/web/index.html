  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <title>SyncScript - Real-Time Collaborative Code Editor</title>
    <meta
      name="description"
      content="SyncScript is a real-time collaborative code editor: share a workspace, edit the same file together with live cursors, chat alongside your code, and run Python, C++, Java and JavaScript in the browser."
    />

    <!-- Open Graph / social preview.
         Add an og:image tag pointing at a 1200x630 PNG once artwork exists;
         a tag referencing a missing file renders worse than no tag at all. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SyncScript" />
    <meta property="og:title" content="SyncScript - Real-Time Collaborative Code Editor" />
    <meta
      property="og:description"
      content="Share a workspace, edit the same file together with live cursors, chat alongside your code, and run Python, C++, Java and JavaScript in the browser."
    />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SyncScript - Real-Time Collaborative Code Editor" />
    <meta
      name="twitter:description"
      content="Share a workspace, edit the same file together with live cursors, chat alongside your code, and run Python, C++, Java and JavaScript in the browser."
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
